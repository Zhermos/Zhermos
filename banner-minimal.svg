<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient: Deep Space Black -->
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Monochrome Titanium Shimmer Gradient -->
    <linearGradient id="silverShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ultra Soft Apple Radial Backdrop -->
    <radialGradient id="subtleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .sf-pro {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        text-anchor: middle;
      }
      .shimmer-text {
        animation: breathText 8s ease-in-out infinite alternate;
      }
      @keyframes breathText {
        0% { opacity: 0.9; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card Border & Background -->
  <rect x="1" y="1" width="918" height="258" rx="20" fill="url(#titaniumBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Subtle Center Aura -->
  <rect x="1" y="1" width="918" height="258" rx="20" fill="url(#subtleAura)" />

  <!-- Monogram / Top Identifier -->
  <text x="460" y="68" class="sf-pro" font-size="11.5" font-weight="600" fill="#52525b" letter-spacing="4">
    ZEDRAYAMI · SWIFT &amp; INTELLIGENT SYSTEMS
  </text>

  <!-- Big Titanium Shimmer Headline -->
  <text x="460" y="134" class="sf-pro shimmer-text" font-size="38" font-weight="700" fill="url(#silverShimmer)" letter-spacing="-1">
    Engineering with Clarity &amp; Precision
  </text>

  <!-- Clean Subtext -->
  <text x="460" y="174" class="sf-pro" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    iOS Architecture  ·  Computer Vision  ·  Computational Research
  </text>

  <!-- Micro Footer Line & Handle -->
  <line x1="380" y1="208" x2="540" y2="208" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="460" y="232" class="sf-pro" font-size="11" font-weight="500" fill="#475569" letter-spacing="2">
    GITHUB.COM/ZHERMOS
  </text>
</svg>
