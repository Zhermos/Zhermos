<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Dark Titanium Mesh -->
    <linearGradient id="bgBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Pure Platinum Shimmer -->
    <linearGradient id="platinumShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <style>
      .sf-huge {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 800;
        text-anchor: middle;
      }
      .line-pulse {
        animation: breathLine 4s ease-in-out infinite alternate;
      }
      @keyframes breathLine {
        0% { opacity: 0.3; transform: scaleX(0.85); }
        100% { opacity: 0.85; transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="918" height="218" rx="20" fill="url(#bgBlack)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- The Only Focus: Giant Name -->
  <text x="460" y="128" class="sf-huge" font-size="82" fill="url(#platinumShimmer)" letter-spacing="-2.5">
    Zedrayami
  </text>

  <!-- Ultra Thin Subtle Center Accent -->
  <g class="line-pulse" style="transform-origin: 460px 156px;">
    <line x1="410" y1="156" x2="510" y2="156" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
