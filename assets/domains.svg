<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="550">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .big { font-family: Impact, 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.8px; }
    .thm { font-family: 'Sukhumvit Set', 'Leelawadee UI', 'Noto Sans Thai', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card-title { font-size: 28px; fill: #f0f6fc; }
    .card-num { font-size: 13px; font-weight: 700; fill: #58a6ff; letter-spacing: 1px; }
    .card-desc { font-size: 14px; font-weight: 400; fill: #8b949e; line-height: 1.5; }
    .chip-text { font-size: 11px; font-weight: 500; fill: #c9d1d9; }
  </style>

  <!-- ================= CARD 01: ALGORITHMS ================= -->
  <g transform="translate(10, 10)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Header Indicator -->
    <rect x="32" y="32" width="7" height="7" rx="1.5" fill="#58a6ff" />
    <text x="47" y="39" class="mono card-num">01</text>
    
    <!-- Bold Hero Title -->
    <text x="32" y="80" class="big card-title">ALGORITHMS<tspan fill="#58a6ff">.</tspan></text>
    
    <!-- Clean Thai Descriptions -->
    <text x="32" y="116" class="thm card-desc">แข่งแก้โจทย์ปัญหาเชิงคำนวณและสอวน.คอม</text>
    <text x="32" y="140" class="thm card-desc">ออกแบบอัลกอริทึมและโครงสร้างข้อมูลขั้นสูง</text>
    
    <!-- Tech Stack Pills -->
    <g transform="translate(32, 185)">
      <rect width="65" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="32.5" y="17" class="mono chip-text" text-anchor="middle">C++</text>

      <rect x="73" width="95" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="120.5" y="17" class="mono chip-text" text-anchor="middle">Algorithms</text>

      <rect x="176" width="128" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="240" y="17" class="mono chip-text" text-anchor="middle">Data Structures</text>
    </g>

    <!-- RIGHT: Minimalist Code & Tree Graphic (with Real 3D Isometric Cube) -->
    <g transform="translate(420, 65)">
      <rect width="120" height="120" rx="14" fill="#16171a" stroke="#27272a" stroke-width="1" />
      
      <!-- Top Dots -->
      <circle cx="20" cy="20" r="2.5" fill="#3f3f46" />
      <circle cx="28" cy="20" r="2.5" fill="#3f3f46" />
      <circle cx="36" cy="20" r="2.5" fill="#3f3f46" />
      
      <!-- Tree Branch Lines -->
      <line x1="60" y1="42" x2="42" y2="62" stroke="#30363d" stroke-width="1.5" />
      <line x1="42" y1="62" x2="32" y2="86" stroke="#30363d" stroke-width="1.2" stroke-dasharray="2 2" />
      <line x1="42" y1="62" x2="52" y2="86" stroke="#30363d" stroke-width="1.2" stroke-dasharray="2 2" />
      
      <!-- Active Execution Branch -->
      <line x1="60" y1="42" x2="78" y2="62" stroke="#58a6ff" stroke-width="1.8" />
      <line x1="78" y1="62" x2="88" y2="86" stroke="#58a6ff" stroke-width="1.5" />

      <!-- Tree Nodes -->
      <circle cx="42" cy="62" r="4" fill="#30363d" />
      <circle cx="32" cy="86" r="3" fill="#484f58" />
      <circle cx="52" cy="86" r="3" fill="#484f58" />

      <circle cx="60" cy="42" r="5" fill="#f0f6fc" stroke="#58a6ff" stroke-width="1.5" />
      <circle cx="78" cy="62" r="5" fill="#58a6ff" />
      <circle cx="88" cy="86" r="4" fill="#f0f6fc" stroke="#58a6ff" stroke-width="1.2" />

      <!-- Real 3D Isometric Blue Cube (Floating Gently) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <!-- Top Face -->
        <polygon points="100,16 109,21 100,26 91,21" fill="#79c0ff" />
        <!-- Left Face -->
        <polygon points="91,21 100,26 100,38 91,33" fill="#58a6ff" />
        <!-- Right Face -->
        <polygon points="100,26 109,21 109,33 100,38" fill="#1f6feb" />
      </g>
    </g>
  </g>

  <!-- ================= CARD 02: COMPUTER VISION ================= -->
  <g transform="translate(615, 10)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="32" width="7" height="7" rx="1.5" fill="#58a6ff" />
    <text x="47" y="39" class="mono card-num">02</text>
    
    <text x="32" y="80" class="big card-title">COMPUTER VISION<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="116" class="thm card-desc">ระบบตรวจจับอาวุธและพฤติกรรม Real-time</text>
    <text x="32" y="140" class="thm card-desc">ประมวลผล Vision AI บนอุปกรณ์ฝังตัว</text>
    
    <g transform="translate(32, 185)">
      <rect width="78" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="39" y="17" class="mono chip-text" text-anchor="middle">Python</text>

      <rect x="86" width="70" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="121" y="17" class="mono chip-text" text-anchor="middle">YOLO</text>

      <rect x="164" width="85" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="206" y="17" class="mono chip-text" text-anchor="middle">OpenCV</text>
    </g>

    <!-- RIGHT: Minimalist Target Viewfinder (with Real 3D Isometric White Cube) -->
    <g transform="translate(420, 65)">
      <rect width="120" height="120" rx="14" fill="#16171a" stroke="#27272a" stroke-width="1" />
      
      <!-- Target Corner Brackets -->
      <path d="M 28 42 L 28 32 L 38 32" fill="none" stroke="#58a6ff" stroke-width="2" />
      <path d="M 92 42 L 92 32 L 82 32" fill="none" stroke="#58a6ff" stroke-width="2" />
      <path d="M 28 78 L 28 88 L 38 88" fill="none" stroke="#58a6ff" stroke-width="2" />
      <path d="M 92 78 L 92 88 L 82 88" fill="none" stroke="#58a6ff" stroke-width="2" />

      <!-- Reticle Circle & Crosshairs -->
      <circle cx="60" cy="60" r="18" fill="none" stroke="#30363d" stroke-dasharray="3 3" />
      
      <line x1="42" y1="60" x2="48" y2="60" stroke="#58a6ff" stroke-width="1.5" />
      <line x1="72" y1="60" x2="78" y2="60" stroke="#58a6ff" stroke-width="1.5" />
      <line x1="60" y1="42" x2="60" y2="48" stroke="#58a6ff" stroke-width="1.5" />
      <line x1="60" y1="72" x2="60" y2="78" stroke="#58a6ff" stroke-width="1.5" />

      <!-- Center Lock Dot -->
      <circle cx="60" cy="60" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>

      <!-- Real 3D Isometric White Cube (Floating Gently) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <!-- Top Face -->
        <polygon points="80,16 89,21 80,26 71,21" fill="#ffffff" />
        <!-- Left Face -->
        <polygon points="71,21 80,26 80,38 71,33" fill="#d0d7de" />
        <!-- Right Face -->
        <polygon points="80,26 89,21 89,33 80,38" fill="#8b949e" />
      </g>
    </g>
  </g>

  <!-- ================= CARD 03: SCIENTIFIC COMPUTING ================= -->
  <g transform="translate(10, 280)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="32" width="7" height="7" rx="1.5" fill="#58a6ff" />
    <text x="47" y="39" class="mono card-num">03</text>
    
    <text x="32" y="80" class="big card-title">SCIENTIFIC COMP<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="116" class="thm card-desc">จำลองและควบคุมอนุภาคระดับนาโน</text>
    <text x="32" y="140" class="thm card-desc">ด้วยแรงกลจากคลื่นเสียงความถี่สูง (SSAW)</text>
    
    <g transform="translate(32, 185)">
      <rect width="80" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="40" y="17" class="mono chip-text" text-anchor="middle">Physics</text>

      <rect x="88" width="88" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="132" y="17" class="mono chip-text" text-anchor="middle">Nanotech</text>

      <rect x="184" width="98" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="233" y="17" class="mono chip-text" text-anchor="middle">Simulation</text>
    </g>

    <!-- RIGHT: Minimalist Acoustic SSAW Wave (with Real 3D Isometric Blue Cube) -->
    <g transform="translate(420, 65)">
      <rect width="120" height="120" rx="14" fill="#16171a" stroke="#27272a" stroke-width="1" />
      
      <!-- Calm SSAW Wave Curve -->
      <path d="M 20 60 C 35 32, 45 32, 60 60 C 75 88, 85 88, 100 60" fill="none" stroke="#58a6ff" stroke-width="2" />
      <path d="M 20 60 C 35 88, 45 88, 60 60 C 75 32, 85 32, 100 60" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="2 3" />

      <!-- Nodal Line Center Axis -->
      <line x1="60" y1="28" x2="60" y2="92" stroke="rgba(88, 166, 255, 0.3)" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Trapped Levitating Microparticles (Subtle 3px Vibrate) -->
      <circle cx="60" cy="60" r="5.5" fill="#f0f6fc">
        <animate attributeName="cy" values="60;57;60" dur="3s" repeatCount="indefinite" />
      </circle>
      
      <circle cx="70" cy="48" r="2.5" fill="#58a6ff">
        <animate attributeName="cy" values="48;45;48" dur="2.4s" repeatCount="indefinite" />
      </circle>

      <!-- Real 3D Isometric Blue Cube -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <!-- Top Face -->
        <polygon points="28,16 37,21 28,26 19,21" fill="#79c0ff" />
        <!-- Left Face -->
        <polygon points="19,21 28,26 28,38 19,33" fill="#58a6ff" />
        <!-- Right Face -->
        <polygon points="28,26 37,21 37,33 28,38" fill="#1f6feb" />
      </g>
    </g>
  </g>

  <!-- ================= CARD 04: WEB DEV ================= -->
  <g transform="translate(615, 280)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="32" width="7" height="7" rx="1.5" fill="#58a6ff" />
    <text x="47" y="39" class="mono card-num">04</text>
    
    <text x="32" y="80" class="big card-title">WEB DEV<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="116" class="thm card-desc">แพลตฟอร์มสนับสนุนการรับมือน้ำท่วม</text>
    <text x="32" y="140" class="thm card-desc">รายงานจุดเสี่ยงและประสานงานกู้ภัยสาธารณะ</text>
    
    <g transform="translate(32, 185)">
      <rect width="95" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="47" y="17" class="mono chip-text" text-anchor="middle">JavaScript</text>

      <rect x="103" width="70" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="138" y="17" class="mono chip-text" text-anchor="middle">Node.js</text>

      <rect x="181" width="105" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="233" y="17" class="mono chip-text" text-anchor="middle">SAVE-FLOOD</text>
    </g>

    <!-- RIGHT: Minimalist Web Browser (with Real 3D Isometric White Cube) -->
    <g transform="translate(420, 65)">
      <rect width="120" height="120" rx="14" fill="#16171a" stroke="#27272a" stroke-width="1" />
      
      <!-- Browser Titlebar -->
      <path d="M 0 14 A 14 14 0 0 1 14 0 L 106 0 A 14 14 0 0 1 120 14 L 120 28 L 0 28 Z" fill="#202228" />
      <circle cx="18" cy="14" r="2.5" fill="#3f3f46" />
      <circle cx="26" cy="14" r="2.5" fill="#3f3f46" />
      <circle cx="34" cy="14" r="2.5" fill="#3f3f46" />

      <!-- Hero Code Tag -->
      <text x="60" y="74" class="big" font-size="32" fill="#58a6ff" text-anchor="middle">&lt; / &gt;</text>
      
      <!-- Subtle Code Line -->
      <rect x="25" y="92" width="28" height="4" rx="2" fill="#30363d" />
      <rect x="58" y="92" width="38" height="4" rx="2" fill="#21262d" />

      <!-- Real 3D Isometric White Cube (Floating Gently) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <!-- Top Face -->
        <polygon points="100,28 109,33 100,38 91,33" fill="#ffffff" />
        <!-- Left Face -->
        <polygon points="91,33 100,38 100,50 91,45" fill="#d0d7de" />
        <!-- Right Face -->
        <polygon points="100,38 109,33 109,45 100,50" fill="#8b949e" />
      </g>
    </g>
  </g>
</svg>
