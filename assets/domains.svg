<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .name-title { font-size: 48px; font-weight: 700; letter-spacing: -0.8px; }
    
    .step-0 { animation: d0 7.5s infinite; }
    .step-1 { animation: d1 7.5s infinite; }
    .step-2 { animation: d2 7.5s infinite; }
    .step-3 { animation: d3 7.5s infinite; }
    .step-4 { animation: d4 7.5s infinite; }
    .step-5 { animation: d5 7.5s infinite; }
    .step-6 { animation: d6 7.5s infinite; }
    .step-7 { animation: d7 7.5s infinite; }
    .step-final { animation: dFinal 7.5s infinite; }

    @keyframes d0 { 0%, 4% { opacity: 1; } 4.1%, 100% { opacity: 0; } }
    @keyframes d1 { 0%, 4% { opacity: 0; } 4.1%, 8% { opacity: 1; } 8.1%, 100% { opacity: 0; } }
    @keyframes d2 { 0%, 8% { opacity: 0; } 8.1%, 12% { opacity: 1; } 12.1%, 100% { opacity: 0; } }
    @keyframes d3 { 0%, 12% { opacity: 0; } 12.1%, 16% { opacity: 1; } 16.1%, 100% { opacity: 0; } }
    @keyframes d4 { 0%, 16% { opacity: 0; } 16.1%, 20% { opacity: 1; } 20.1%, 100% { opacity: 0; } }
    @keyframes d5 { 0%, 20% { opacity: 0; } 20.1%, 24% { opacity: 1; } 24.1%, 100% { opacity: 0; } }
    @keyframes d6 { 0%, 24% { opacity: 0; } 24.1%, 28% { opacity: 1; } 28.1%, 100% { opacity: 0; } }
    @keyframes d7 { 0%, 28% { opacity: 0; } 28.1%, 32% { opacity: 1; } 32.1%, 100% { opacity: 0; } }
    @keyframes dFinal { 0%, 32% { opacity: 0; } 32.1%, 94% { opacity: 1; } 94.1%, 100% { opacity: 0; } }
  </style>

  <!-- Clean Matte Background (No Glow) -->
  <rect width="1200" height="280" rx="14" fill="#0b0b0c" stroke="#21262d" stroke-width="1" />

  <!-- ================= LEFT: TYPOGRAPHY & BINARY DECODER ================= -->
  <g transform="translate(80, 0)">
    <!-- Small Category Badge -->
    <g transform="translate(0, 68)">
      <circle cx="5" cy="5" r="3.5" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="9" class="mono" font-size="11" fill="#58a6ff" font-weight="600" letter-spacing="1.5">ZEDRAYAMI</text>
    </g>

    <!-- BINARY TO TEXT DECODING SEQUENCE -->
    <text x="0" y="142" class="sans name-title step-0" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.04;0.041;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#58a6ff">01001010_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.041;0.08;0.081;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#58a6ff">01011010_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.081;0.12;0.121;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Z</tspan><tspan fill="#58a6ff">01100101_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.121;0.16;0.161;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Ze</tspan><tspan fill="#58a6ff">0110010_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.161;0.20;0.201;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Zed</tspan><tspan fill="#58a6ff">011100_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.201;0.24;0.241;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Zedra</tspan><tspan fill="#58a6ff">0111_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.241;0.28;0.281;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Zedrayam</tspan><tspan fill="#58a6ff">01_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.281;0.32;0.321;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Zedrayami</tspan><tspan fill="#58a6ff">_</tspan>
    </text>

    <text x="0" y="142" class="sans name-title step-final" opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.321;0.94;0.941;1" dur="7.5s" repeatCount="indefinite" />
      <tspan fill="#f0f6fc">Zedrayami</tspan><tspan fill="#58a6ff">.</tspan>
    </text>

    <!-- Focus Domains -->
    <text x="0" y="180" class="sans" font-size="16" font-weight="500" fill="#8b949e">
      Competitive Programming  ·  Edge AIoT  ·  Scientific Tech  ·  Civic Web
    </text>

    <!-- Tagline -->
    <text x="0" y="214" class="mono" font-size="12.5" fill="#484f58">
      Exploring where software interacts with physical reality.
    </text>
  </g>

  <!-- ================= RIGHT: HIGH-TECH LARGE-SCALE ACOUSTIC SIMULATION FIELD ================= -->
  <g>
    <!-- Background Coordinate Grid Axes -->
    <line x1="740" y1="140" x2="1140" y2="140" stroke="#1c2128" stroke-width="1" stroke-dasharray="3 5" />
    <line x1="940" y1="35" x2="940" y2="245" stroke="#1c2128" stroke-width="1" stroke-dasharray="3 5" />

    <!-- Outer Scope Ring with Tick Marks (r=98) -->
    <circle cx="940" cy="140" r="98" fill="none" stroke="#21262d" stroke-width="1" />
    <circle cx="940" cy="42" r="2" fill="#58a6ff" />
    <circle cx="940" cy="238" r="2" fill="#58a6ff" />
    <circle cx="842" cy="140" r="2" fill="#58a6ff" />
    <circle cx="1038" cy="140" r="2" fill="#58a6ff" />

    <!-- Rotating Orbit Ring 1 (r=82, Clockwise 28s) -->
    <g>
      <circle cx="940" cy="140" r="82" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 8" />
      <circle cx="940" cy="58" r="3" fill="#58a6ff" />
      <animateTransform attributeName="transform" type="rotate" from="0 940 140" to="360 940 140" dur="28s" repeatCount="indefinite" />
    </g>

    <!-- Counter-Rotating Ring 2 (r=62, Counter-Clockwise 20s) -->
    <g>
      <circle cx="940" cy="140" r="62" fill="none" stroke="#262c36" stroke-width="1" stroke-dasharray="3 5" />
      <circle cx="940" cy="78" r="2.5" fill="#f0f6fc" stroke="#58a6ff" stroke-width="1" />
      <animateTransform attributeName="transform" type="rotate" from="360 940 140" to="0 940 140" dur="20s" repeatCount="indefinite" />
    </g>

    <!-- Rotating Hexagonal Guide (r=42, 40s) -->
    <polygon points="940,98 976,119 976,161 940,182 904,161 904,119" fill="none" stroke="#1e232a" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 940 140" to="360 940 140" dur="40s" repeatCount="indefinite" />
    </polygon>

    <!-- ================= STANDING ACOUSTIC WAVEFIELD (SSAW HARMONICS) ================= -->
    <!-- Secondary Subtle Reference Wave (Dashed) -->
    <path d="M 740 140 C 765 105, 815 105, 840 140 C 865 175, 915 175, 940 140 C 965 105, 1015 105, 1040 140 C 1065 175, 1115 175, 1140 140" 
          fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3 4" />
    
    <!-- Wave 1: Primary Incident Standing Wave (Height: 130px!) -->
    <path d="M 740 140 C 765 75, 815 75, 840 140 C 865 205, 915 205, 940 140 C 965 75, 1015 75, 1040 140 C 1065 205, 1115 205, 1140 140" 
          fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- Wave 2: Opposing Reflected Standing Wave (Phase Oscillating) -->
    <path d="M 740 140 C 765 205, 815 205, 840 140 C 865 75, 915 75, 940 140 C 965 205, 1015 205, 1040 140 C 1065 75, 1115 75, 1140 140" 
          fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="3 3">
      <animate attributeName="stroke-opacity" values="0.85;0.3;0.85" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- Vertical Pressure Gradient Line (Center Nodal Axis) -->
    <line x1="940" y1="48" x2="940" y2="232" stroke="rgba(88, 166, 255, 0.3)" stroke-width="1.2" stroke-dasharray="2 3">
      <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- Harmonic Node Markers on Side Nodes -->
    <circle cx="840" cy="140" r="3.5" fill="#111113" stroke="#58a6ff" stroke-width="1.2" />
    <circle cx="1040" cy="140" r="3.5" fill="#111113" stroke="#58a6ff" stroke-width="1.2" />

    <!-- ================= CENTRAL PARTICLE LEVITATION CORE ================= -->
    <circle cx="940" cy="140" r="14" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 940 140" to="360 940 140" dur="10s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="940" cy="140" r="9" fill="#111113" stroke="#58a6ff" stroke-width="1.5" />
    
    <circle cx="940" cy="140" r="5" fill="#f0f6fc">
      <animate attributeName="r" values="4.5;5.8;4.5" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Micro Levitating Nanoparticles Trapped around Core -->
    <circle cx="934" cy="132" r="2" fill="#58a6ff">
      <animate attributeName="cy" values="132;130;133;132" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="934;936;933;934" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="948" cy="146" r="2" fill="#58a6ff">
      <animate attributeName="cy" values="146;148;145;146" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="948;946;949;948" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="946" cy="133" r="1.4" fill="#71717a">
      <animate attributeName="cy" values="133;131;134;133" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="932" cy="147" r="1.4" fill="#71717a">
      <animate attributeName="cy" values="147;149;146;147" dur="3.2s" repeatCount="indefinite" />
    </circle>

    <!-- ================= TELEMETRY LABELS & ANNOTATIONS ================= -->
    <g transform="translate(940, 36)">
      <rect x="-68" y="-12" width="136" height="20" rx="4" fill="#111113" stroke="#27272a" stroke-width="0.8" />
      <circle cx="-54" cy="-2" r="2" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="-46" y="2" class="mono" font-size="8.5" fill="#8b949e">SSAW FIELD // 2.45 MHz</text>
    </g>

    <text x="940" y="254" class="mono" font-size="9" fill="#71717a" text-anchor="middle" letter-spacing="1.5">&#955;/2 ACOUSTIC TRAP · EQUILIBRIUM</text>
    <text x="745" y="134" class="mono" font-size="7.5" fill="#484f58">-1.0 &#955;</text>
    <text x="1135" y="134" class="mono" font-size="7.5" fill="#484f58" text-anchor="end">+1.0 &#955;</text>
  </g>
</svg>
