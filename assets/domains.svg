<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="550">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .card-title { font-size: 18.5px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.3px; }
    .card-num { font-size: 12.5px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.5px; }
    .card-desc { font-size: 14px; fill: #8b949e; }
    .chip-text { font-size: 11px; font-weight: 500; fill: #c9d1d9; }
  </style>

  <!-- ================= CARD 01: COMPETITIVE PROGRAMMING & ALGORITHMS ================= -->
  <g transform="translate(10, 10)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="30" width="8" height="8" rx="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="48" y="38" class="mono card-num">01 // PROBLEM SOLVING</text>
    <text x="32" y="78" class="sans card-title">COMPETITIVE PROGRAMMING &amp; ALGORITHMS<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="112" class="sans card-desc">แข่งแก้โจทย์ปัญหาเชิงคำนวณและสอวน.คอม</text>
    <text x="32" y="136" class="sans card-desc">ออกแบบอัลกอริทึมและโครงสร้างข้อมูลขั้นสูง</text>
    
    <g transform="translate(32, 185)">
      <rect width="65" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="32.5" y="17" class="mono chip-text" text-anchor="middle">C++</text>

      <rect x="73" width="95" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="120.5" y="17" class="mono chip-text" text-anchor="middle">Algorithms</text>

      <rect x="176" width="128" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="240" y="17" class="mono chip-text" text-anchor="middle">Data Structures</text>
    </g>

    <!-- Animated Graphic: Code Editor + Blinking Cursor + Accepted Status -->
    <g transform="translate(480, 125)">
      <rect x="-52" y="-46" width="104" height="92" rx="7" fill="#141416" stroke="#27272a" stroke-width="1" />
      <path d="M -52 -39 A 7 7 0 0 1 -45 -46 L 45 -46 A 7 7 0 0 1 52 -39 L 52 -28 L -52 -28 Z" fill="#1c1c20" />
      <circle cx="-42" cy="-37" r="2.2" fill="#3f3f46" />
      <circle cx="-35" cy="-37" r="2.2" fill="#3f3f46" />
      <circle cx="-28" cy="-37" r="2.2" fill="#3f3f46" />
      <text x="6" y="-34" class="mono" font-size="7.5" fill="#8b949e" text-anchor="middle">algo.cpp</text>
      
      <text x="-42" y="-14" class="mono" font-size="7.5" fill="#58a6ff">&lt;/&gt; <tspan fill="#e6edf3">dfs</tspan><tspan fill="#8b949e">(u, adj)</tspan></text>
      <text x="-32" y="-2" class="mono" font-size="7" fill="#8b949e">  dp[u] += <tspan fill="#58a6ff">solve</tspan>();</text>
      <!-- Blinking Code Cursor -->
      <rect x="23" y="-8.5" width="4.5" height="8" rx="0.5" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete" />
      </rect>
      
      <text x="-42" y="10" class="mono" font-size="7.5" fill="#58a6ff">return <tspan fill="#e6edf3">ans</tspan>;</text>
      
      <line x1="-46" y1="18" x2="46" y2="18" stroke="#222226" stroke-width="1" />
      <!-- Pulsing Accepted Badge -->
      <rect x="-42" y="24" width="46" height="14" rx="3" fill="rgba(88, 166, 255, 0.1)" stroke="rgba(88, 166, 255, 0.25)" stroke-width="0.8">
        <animate attributeName="stroke-opacity" values="0.25;0.75;0.25" dur="2.4s" repeatCount="indefinite" />
      </rect>
      <text x="-19" y="34.5" class="mono" font-size="7" font-weight="600" fill="#58a6ff" text-anchor="middle">ACCEPTED</text>
      <text x="44" y="34.5" class="mono" font-size="7.5" fill="#71717a" text-anchor="end">O(N log N)</text>
    </g>
  </g>

  <!-- ================= CARD 02: AIoT & COMPUTER VISION ================= -->
  <g transform="translate(615, 10)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="30" width="8" height="8" rx="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="48" y="38" class="mono card-num">02 // EMBEDDED AI</text>
    <text x="32" y="78" class="sans card-title">AIoT &amp; COMPUTER VISION<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="112" class="sans card-desc">ระบบตรวจจับอาวุธและพฤติกรรม Real-time</text>
    <text x="32" y="136" class="sans card-desc">ประมวลผล Vision AI บนอุปกรณ์ฝังตัว</text>
    
    <g transform="translate(32, 185)">
      <rect width="78" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="39" y="17" class="mono chip-text" text-anchor="middle">Python</text>

      <rect x="86" width="70" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="121" y="17" class="mono chip-text" text-anchor="middle">YOLO</text>

      <rect x="164" width="85" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="206" y="17" class="mono chip-text" text-anchor="middle">OpenCV</text>
    </g>

    <!-- Animated Graphic: YOLO Real-time Laser Scan + Target Reticle -->
    <g transform="translate(480, 125)">
      <rect x="-52" y="-46" width="104" height="92" rx="7" fill="#141416" stroke="#27272a" stroke-width="1" />
      <path d="M -44 -26 L -44 -38 L -32 -38" fill="none" stroke="#3f3f46" stroke-width="1.2" />
      <path d="M 44 -26 L 44 -38 L 32 -38" fill="none" stroke="#3f3f46" stroke-width="1.2" />
      <path d="M -44 14 L -44 26 L -32 26" fill="none" stroke="#3f3f46" stroke-width="1.2" />
      <path d="M 44 14 L 44 26 L 32 26" fill="none" stroke="#3f3f46" stroke-width="1.2" />
      
      <rect x="-26" y="-20" width="52" height="40" rx="2" fill="rgba(88, 166, 255, 0.06)" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3 2" />
      
      <!-- Real-time Laser Scan Line -->
      <line x1="-24" y1="-18" x2="24" y2="-18" stroke="#58a6ff" stroke-width="1.2" opacity="0.6">
        <animate attributeName="y1" values="-18;18;-18" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-18;18;-18" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.4s" repeatCount="indefinite" />
      </line>
      
      <!-- Detection Tag Badge -->
      <rect x="-26" y="-30" width="48" height="10" rx="2" fill="#58a6ff" />
      <text x="-2" y="-22.5" class="mono" font-size="6.5" font-weight="700" fill="#0b0b0c" text-anchor="middle">OBJECT: 99%</text>
      
      <!-- Reticle Crosshair with Pulsing Center -->
      <circle cx="0" cy="0" r="3" fill="none" stroke="#58a6ff" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <line x1="-7" y1="0" x2="-4" y2="0" stroke="#58a6ff" stroke-width="1" />
      <line x1="4" y1="0" x2="7" y2="0" stroke="#58a6ff" stroke-width="1" />
      <line x1="0" y1="-7" x2="0" y2="-4" stroke="#58a6ff" stroke-width="1" />
      <line x1="0" y1="4" x2="0" y2="7" stroke="#58a6ff" stroke-width="1" />
      
      <text x="0" y="34" class="mono" font-size="7.5" fill="#71717a" text-anchor="middle">YOLO // EDGE_AI</text>
    </g>
  </g>

  <!-- ================= CARD 03: SCIENTIFIC COMPUTING ================= -->
  <g transform="translate(10, 280)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="30" width="8" height="8" rx="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="48" y="38" class="mono card-num">03 // PHYSICAL SIMULATION</text>
    <text x="32" y="78" class="sans card-title">SCIENTIFIC COMPUTING<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="112" class="sans card-desc">จำลองและควบคุมอนุภาคระดับนาโน</text>
    <text x="32" y="136" class="sans card-desc">ด้วยแรงกลจากคลื่นเสียงความถี่สูง (SSAW)</text>
    
    <g transform="translate(32, 185)">
      <rect width="80" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="40" y="17" class="mono chip-text" text-anchor="middle">Physics</text>

      <rect x="88" width="88" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="132" y="17" class="mono chip-text" text-anchor="middle">Nanotech</text>

      <rect x="184" width="98" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="233" y="17" class="mono chip-text" text-anchor="middle">Simulation</text>
    </g>

    <!-- Animated Graphic: SSAW Acoustic Wave Phase Shift + Nanoparticle Micro-motion -->
    <g transform="translate(480, 125)">
      <rect x="-52" y="-46" width="104" height="92" rx="7" fill="#141416" stroke="#27272a" stroke-width="1" />
      <line x1="-44" y1="-28" x2="44" y2="-28" stroke="#2a2a30" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="-44" y1="18" x2="44" y2="18" stroke="#2a2a30" stroke-width="1" stroke-dasharray="2 2" />
      
      <!-- Standing Wave 1 -->
      <path d="M -42 -5 C -28 -30, -14 20, 0 -5 C 14 -30, 28 20, 42 -5" fill="none" stroke="#58a6ff" stroke-width="1.3" opacity="0.9">
        <animate attributeName="opacity" values="0.45;0.95;0.45" dur="2.2s" repeatCount="indefinite" />
      </path>
      <!-- Standing Wave 2 -->
      <path d="M -42 -5 C -28 20, -14 -30, 0 -5 C 14 20, 28 -30, 42 -5" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4" stroke-dasharray="2 2">
        <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.2s" repeatCount="indefinite" />
      </path>
      
      <!-- Nodal Line -->
      <line x1="0" y1="-24" x2="0" y2="14" stroke="rgba(88, 166, 255, 0.4)" stroke-width="1" stroke-dasharray="1 2">
        <animate attributeName="stroke-opacity" values="0.2;0.75;0.2" dur="2.2s" repeatCount="indefinite" />
      </line>
      
      <!-- Micro-motion Particles -->
      <circle cx="0" cy="-5" r="4" fill="#f0f6fc" stroke="#58a6ff" stroke-width="1.5">
        <animate attributeName="cy" values="-5;-6.2;-4.2;-5" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="-3" cy="-10" r="1.8" fill="#58a6ff" opacity="0.8">
        <animate attributeName="cy" values="-10;-9;-11;-10" dur="2.3s" repeatCount="indefinite" />
        <animate attributeName="cx" values="-3;-2.2;-3.5;-3" dur="2.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="4" cy="-2" r="1.6" fill="#58a6ff" opacity="0.8">
        <animate attributeName="cy" values="-2;-3;-1.4;-2" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="cx" values="4;4.8;3.5;4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="-5" cy="0" r="1.2" fill="#71717a">
        <animate attributeName="cy" values="0;1;-0.8;0" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="3" cy="-11" r="1.2" fill="#71717a">
        <animate attributeName="cy" values="-11;-11.8;-10.2;-11" dur="2.7s" repeatCount="indefinite" />
      </circle>
      
      <text x="0" y="34" class="mono" font-size="7.5" fill="#71717a" text-anchor="middle">SSAW NODE // SIM</text>
    </g>
  </g>

  <!-- ================= CARD 04: WEB DEVELOPMENT ================= -->
  <g transform="translate(615, 280)">
    <rect width="575" height="250" rx="14" fill="#111113" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <rect x="32" y="30" width="8" height="8" rx="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="48" y="38" class="mono card-num">04 // CIVIC PLATFORMS</text>
    <text x="32" y="78" class="sans card-title">WEB DEVELOPMENT<tspan fill="#58a6ff">.</tspan></text>
    
    <text x="32" y="112" class="sans card-desc">แพลตฟอร์มสนับสนุนการรับมือน้ำท่วม</text>
    <text x="32" y="136" class="sans card-desc">รายงานจุดเสี่ยงและประสานงานกู้ภัยสาธารณะ</text>
    
    <g transform="translate(32, 185)">
      <rect width="95" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="47" y="17" class="mono chip-text" text-anchor="middle">JavaScript</text>

      <rect x="103" width="70" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="138" y="17" class="mono chip-text" text-anchor="middle">Node.js</text>

      <rect x="181" width="105" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="233" y="17" class="mono chip-text" text-anchor="middle">SAVE-FLOOD</text>
    </g>

    <!-- Animated Graphic: Web Browser + Real-time Streaming Pulse + UI Skeleton -->
    <g transform="translate(480, 125)">
      <rect x="-52" y="-46" width="104" height="92" rx="7" fill="#141416" stroke="#27272a" stroke-width="1" />
      <path d="M -52 -39 A 7 7 0 0 1 -45 -46 L 45 -46 A 7 7 0 0 1 52 -39 L 52 -28 L -52 -28 Z" fill="#1c1c20" />
      <circle cx="-42" cy="-37" r="2.2" fill="#3f3f46" />
      <circle cx="-35" cy="-37" r="2.2" fill="#3f3f46" />
      <circle cx="-28" cy="-37" r="2.2" fill="#3f3f46" />
      
      <rect x="-20" y="-42" width="64" height="10" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.8" />
      <text x="-14" y="-34.5" class="mono" font-size="5.5" fill="#8b949e">save-flood.org</text>
      
      <rect x="-44" y="-22" width="88" height="10" rx="2" fill="#1c1c20" />
      <rect x="-40" y="-18" width="18" height="3" rx="1.5" fill="#58a6ff" />
      <circle cx="36" cy="-17" r="2" fill="#58a6ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="30" cy="-17" r="2" fill="#3f3f46" />
      
      <rect x="-44" y="-8" width="34" height="32" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
      <line x1="-39" y1="-2" x2="-20" y2="-2" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="x2" values="-28;-16;-28" dur="2.4s" repeatCount="indefinite" />
      </line>
      <line x1="-39" y1="5" x2="-15" y2="5" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-39" y1="11" x2="-22" y2="11" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-39" y1="17" x2="-16" y2="17" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" />
      
      <rect x="-6" y="-8" width="50" height="32" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
      <rect x="-1" y="-3" width="40" height="9" rx="2" fill="rgba(88, 166, 255, 0.12)" stroke="rgba(88, 166, 255, 0.25)" stroke-width="0.8">
        <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2s" repeatCount="indefinite" />
      </rect>
      <circle cx="4" cy="1.5" r="1.5" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="21" y="3.5" class="mono" font-size="5" fill="#58a6ff" text-anchor="middle">LIVE_MAP</text>
      
      <line x1="-1" y1="12" x2="39" y2="12" stroke="#2a2a30" stroke-width="1" />
      <line x1="-1" y1="18" x2="25" y2="18" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" />
      
      <text x="0" y="34" class="mono" font-size="7.5" fill="#71717a" text-anchor="middle">WEB_APP // FULL-STACK</text>
    </g>
  </g>
</svg>
