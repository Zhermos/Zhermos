<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Subtle Dot Grid Pattern (PepesX231 Style) -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363d" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .bg { fill: #0b0b0c; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .big { font-family: Impact, 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1.5px; }
    .thm { font-family: 'Sukhumvit Set', 'Leelawadee UI', 'Noto Sans Thai', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Clean Matte Background -->
  <rect width="1200" height="280" rx="14" fill="#0b0b0c" stroke="#21262d" stroke-width="1" />

  <!-- Ambient Dot Matrix Texture -->
  <rect width="1200" height="280" rx="14" fill="url(#dotGrid)" />

  <!-- ================= LEFT: FLOATING 3D ISOMETRIC WHITE CUBE ================= -->
  <g transform="translate(60, 0)">
    <!-- Soft Ambient Floor Shadow -->
    <ellipse cx="100" cy="195" rx="24" ry="11" fill="#000000" opacity="0.45">
      <animate attributeName="rx" values="24;20;24" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="opacity" values="0.45;0.25;0.45" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </ellipse>

    <!-- Floating 3D White Cube (Smooth Slow Hover) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      
      <!-- Top Face (Direct Light - Crisp White) -->
      <polygon points="100,105 132,123 100,141 68,123" fill="#ffffff" />
      <!-- Left Face (Diffuse Light - Silver Grey) -->
      <polygon points="68,123 100,141 100,177 68,159" fill="#d0d7de" />
      <!-- Right Face (Shadow Side - Steel Grey) -->
      <polygon points="100,141 132,123 132,159 100,177" fill="#8b949e" />
      
      <!-- Crisp Edge Highlight -->
      <line x1="100" y1="141" x2="100" y2="177" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />
      <line x1="68" y1="123" x2="100" y2="141" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1" />
    </g>

    <!-- Small Accent Dot -->
    <circle cx="170" cy="90" r="2.5" fill="#58a6ff" opacity="0.7" />
  </g>

  <!-- ================= CENTER: BOLD HERO TYPOGRAPHY ================= -->
  <g>
    <!-- Top Lead-in -->
    <text x="600" y="58" class="mono" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="3" text-anchor="middle">HELLO, I'M · สวัสดีครับ ผม</text>

    <!-- Big Bold Hero Name -->
    <text x="600" y="136" class="big" font-size="82" fill="#f0f6fc" text-anchor="middle">ZEDRAYAMI<tspan fill="#58a6ff">.</tspan></text>

    <!-- Handle with Blinking Block Cursor -->
    <text x="600" y="174" class="mono" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle">&gt; Zed<tspan fill="#58a6ff">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete" /></tspan></text>

    <!-- Thai Tagline in Clean Loopless Thai Font -->
    <text x="600" y="210" class="thm" font-size="16" font-weight="500" fill="#f0f6fc" text-anchor="middle">สำรวจจุดที่ซอฟต์แวร์เชื่อมต่อกับโลกความจริง</text>

    <!-- Focus Domains -->
    <text x="600" y="244" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" letter-spacing="1.5" text-anchor="middle">COMPETITIVE PROGRAMMING · AIoT · SCIENTIFIC COMPUTING · WEB DEV</text>
  </g>

  <!-- ================= RIGHT: FLOATING 3D ISOMETRIC BLUE & DARK CUBES ================= -->
  <g transform="translate(930, 0)">
    <!-- Iconic Upper Right 3D Blue Cube (PepesX231 Signature Motif) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      
      <!-- Top Face -->
      <polygon points="120,40 144,54 120,68 96,54" fill="#79c0ff" />
      <!-- Left Face -->
      <polygon points="96,54 120,68 120,95 96,81" fill="#58a6ff" />
      <!-- Right Face -->
      <polygon points="120,68 144,54 144,81 120,95" fill="#1f6feb" />
      
      <!-- Subtle Edge Glow Line -->
      <line x1="120" y1="68" x2="120" y2="95" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
    </g>

    <!-- Lower Right Subtle Dark Matte 3D Cube with Blue Accent Top -->
    <g transform="translate(20, 110)">
      <ellipse cx="40" cy="85" rx="18" ry="8" fill="#000000" opacity="0.4" />
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        <!-- Top Face -->
        <polygon points="40,25 60,36 40,47 20,36" fill="#1c2333" stroke="#58a6ff" stroke-width="1" />
        <!-- Left Face -->
        <polygon points="20,36 40,47 40,70 20,59" fill="#141822" />
        <!-- Right Face -->
        <polygon points="40,47 60,36 60,59 40,70" fill="#0d1017" />
      </g>
    </g>

    <!-- Small Accent Dot -->
    <circle cx="20" cy="65" r="2" fill="#8b949e" opacity="0.5" />
  </g>
</svg>
