<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <style>
    .bg { fill: #0b0b0c; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .big { font-family: Impact, 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1.5px; }
    .thm { font-family: 'Sukhumvit Set', 'Leelawadee UI', 'Noto Sans Thai', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Clean Matte Background -->
  <rect width="1200" height="280" rx="14" fill="#0b0b0c" stroke="#21262d" stroke-width="1" />

  <!-- Subtle Horizon Ground Line across Banner -->
  <line x1="40" y1="220" x2="1160" y2="220" stroke="#1c2028" stroke-width="1" stroke-dasharray="4 6" />

  <!-- ================= LEFT: SSAW ACOUSTIC STANDING WAVE (PHYSICS / NANO) ================= -->
  <g transform="translate(50, 0)">
    <!-- Baseline & Spec Label -->
    <line x1="20" y1="220" x2="260" y2="220" stroke="#21262d" stroke-width="1.2" />
    <text x="25" y="238" class="mono" font-size="9" fill="#484f58" letter-spacing="1">SSAW · 128 MHz</text>
    <circle cx="130" cy="235" r="2.5" fill="#58a6ff" opacity="0.8" />
    <text x="140" y="238" class="mono" font-size="9" fill="#58a6ff">ACTIVE</text>

    <!-- Background Coordinate Grid for Wave -->
    <line x1="20" y1="150" x2="260" y2="150" stroke="#16191f" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="140" y1="90" x2="140" y2="210" stroke="#1f242e" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Primary SSAW Standing Wave Curve -->
    <path fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="d" 
        values="M 20 150 Q 80 85, 140 150 T 260 150;
                M 20 150 Q 80 150, 140 150 T 260 150;
                M 20 150 Q 80 215, 140 150 T 260 150;
                M 20 150 Q 80 150, 140 150 T 260 150;
                M 20 150 Q 80 85, 140 150 T 260 150" 
        dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />
    </path>

    <!-- Anti-Phase Reference Wave (Dashed) -->
    <path fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="3 4">
      <animate attributeName="d" 
        values="M 20 150 Q 80 215, 140 150 T 260 150;
                M 20 150 Q 80 150, 140 150 T 260 150;
                M 20 150 Q 80 85, 140 150 T 260 150;
                M 20 150 Q 80 150, 140 150 T 260 150;
                M 20 150 Q 80 215, 140 150 T 260 150" 
        dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />
    </path>

    <!-- Acoustically Trapped Microparticles (SSAW Pressure Well) -->
    <circle cx="140" cy="150" r="6" fill="#f0f6fc">
      <animate attributeName="cy" values="150;145;150;155;150" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="150" r="12" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.6">
      <animate attributeName="r" values="10;14;10" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Secondary Satellite Microparticles -->
    <circle cx="80" cy="115" r="3" fill="#58a6ff">
      <animate attributeName="cy" values="115;108;115;122;115" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="185" r="2.5" fill="#8b949e">
      <animate attributeName="cy" values="185;178;185;192;185" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= CENTER: BOLD HERO TYPOGRAPHY ================= -->
  <g>
    <!-- Top Lead-in -->
    <text x="600" y="58" class="mono" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="3" text-anchor="middle">HELLO, I'M · สวัสดีครับ ผม</text>

    <!-- Big Bold Hero Name (Center Aligned) -->
    <text x="600" y="136" class="big" font-size="82" fill="#f0f6fc" text-anchor="middle">ZEDRAYAMI<tspan fill="#58a6ff">.</tspan></text>

    <!-- Handle with Blinking Block Cursor -->
    <text x="600" y="174" class="mono" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle">&gt; Zed<tspan fill="#58a6ff">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete" /></tspan></text>

    <!-- Thai Tagline in Clean Loopless Thai Font -->
    <text x="600" y="210" class="thm" font-size="16" font-weight="500" fill="#f0f6fc" text-anchor="middle">สำรวจจุดที่ซอฟต์แวร์เชื่อมต่อกับโลกความจริง</text>

    <!-- Focus Domains -->
    <text x="600" y="244" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" letter-spacing="1.5" text-anchor="middle">COMPETITIVE PROGRAMMING · AIoT · SCIENTIFIC COMPUTING · WEB DEV</text>
  </g>

  <!-- ================= RIGHT: 3D ISOMETRIC CUBE & LATTICE (ALGORITHMS / CODE) ================= -->
  <g transform="translate(890, 0)">
    <!-- Isometric Ground Reference Grid -->
    <path d="M 40 220 L 140 160 L 240 220 L 140 280 Z" fill="none" stroke="#16181d" stroke-width="1" />
    <line x1="40" y1="220" x2="240" y2="220" stroke="#21262d" stroke-width="1.2" />
    <text x="175" y="238" class="mono" font-size="9" fill="#484f58" letter-spacing="1">ISO · 3D</text>

    <!-- 3D Pedestal Base -->
    <polygon points="140,195 185,208 140,221 95,208" fill="#181c22" stroke="#272d37" stroke-width="1" />
    <polygon points="95,208 140,221 140,233 95,220" fill="#13151a" />
    <polygon points="140,221 185,208 185,220 140,233" fill="#0d0e12" />

    <!-- Isometric Drop Shadow -->
    <ellipse cx="140" cy="190" rx="22" ry="11" fill="#000000" opacity="0.5">
      <animate attributeName="rx" values="22;18;22" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </ellipse>

    <!-- Floating 3D Isometric White Cube (Slow, Smooth Levitation) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      
      <!-- Top Face (Direct Light - Crisp White) -->
      <polygon points="140,118 166,133 140,148 114,133" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" />
      <!-- Left Face (Diffuse Light - Silver Grey) -->
      <polygon points="114,133 140,148 140,178 114,163" fill="#d0d7de" />
      <!-- Right Face (Shadow Side - Steel Grey) -->
      <polygon points="140,148 166,133 166,163 140,178" fill="#8b949e" />
      
      <!-- Crisp Isometric Edge Highlight -->
      <line x1="140" y1="148" x2="140" y2="178" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />
      <line x1="114" y1="133" x2="140" y2="148" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1" />
    </g>

    <!-- Secondary Mini 3D Blue Cube -->
    <g transform="translate(190, 75)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <polygon points="20,0 34,8 20,16 6,8" fill="#79c0ff" />
      <polygon points="6,8 20,16 20,30 6,22" fill="#58a6ff" />
      <polygon points="20,16 34,8 34,22 20,30" fill="#1f6feb" />
    </g>

    <!-- Wireframe 3D Octahedron / Polyhedron Lattice (Scientific / Algorithms) -->
    <g transform="translate(45, 75)" opacity="0.6">
      <polygon points="16,0 28,7 16,14 4,7" fill="none" stroke="#58a6ff" stroke-width="1" />
      <line x1="4" y1="7" x2="4" y2="21" stroke="#58a6ff" stroke-width="1" />
      <line x1="16" y1="14" x2="16" y2="28" stroke="#58a6ff" stroke-width="1" />
      <line x1="28" y1="7" x2="28" y2="21" stroke="#58a6ff" stroke-width="1" />
      <polygon points="16,14 28,21 16,28 4,21" fill="none" stroke="#58a6ff" stroke-width="1" />
    </g>
  </g>
</svg>
