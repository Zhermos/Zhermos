<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Clean Matte Background (No Glow) -->
  <rect width="1200" height="280" rx="14" fill="#0b0b0c" stroke="#21262d" stroke-width="1" />

  <!-- LEFT: CLEAN FLAT TYPOGRAPHY -->
  <g transform="translate(80, 0)">
    <g transform="translate(0, 68)">
      <circle cx="5" cy="5" r="3.5" fill="#58a6ff" />
      <text x="18" y="9" class="mono" font-size="11" fill="#58a6ff" font-weight="600" letter-spacing="1.5">ZEDRAYAMI</text>
    </g>

    <text x="0" y="142" class="sans" font-size="48" font-weight="700" fill="#f0f6fc" letter-spacing="-0.8">
      Zedrayami<tspan fill="#58a6ff">.</tspan>
    </text>

    <text x="0" y="180" class="sans" font-size="16" font-weight="500" fill="#8b949e">
      Applied Physics  ·  Edge AIoT  ·  Swift Native  ·  Civic Resilience
    </text>

    <text x="0" y="214" class="mono" font-size="12.5" fill="#484f58">
      Exploring where software interacts with physical reality.
    </text>
  </g>

  <!-- RIGHT: CLEAN FLAT TECHNICAL WAVE (NO GLOW) -->
  <g>
    <path d="M 760 140 Q 860 80, 960 140 T 1140 140" fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3 4" />
    <path d="M 760 140 Q 860 180, 960 140 T 1140 140" fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3 4" />

    <path d="M 780 140 Q 870 100, 960 140 T 1120 140" fill="none" stroke="#30363d" stroke-width="1.2" />
    <path d="M 780 140 Q 870 70, 960 140 T 1120 140" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-opacity="0.8" />
    <path d="M 780 140 Q 870 210, 960 140 T 1120 140" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-opacity="0.8" />

    <circle cx="960" cy="140" r="16" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="960" cy="140" r="5" fill="#f0f6fc" stroke="#58a6ff" stroke-width="2" />
    
    <text x="960" y="172" class="mono" font-size="9.5" fill="#8b949e" text-anchor="middle" letter-spacing="1">λ NODE</text>
  </g>
</svg>
