<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <style>
    .bg { fill: #0b0b0c; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .big { font-family: Impact, 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1.5px; }
    .thm { font-family: 'Sukhumvit Set', 'Leelawadee UI', 'Noto Sans Thai', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Clean Matte Background -->
  <rect width="1200" height="280" rx="14" fill="#0b0b0c" stroke="#21262d" stroke-width="1" />

  <!-- LEFT: BOLD HERO TYPOGRAPHY (PEPSEX231 MINIMALIST STYLE) -->
  <g transform="translate(80, 0)">
    <!-- Top Lead-in -->
    <text x="0" y="58" class="mono" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="3">HELLO, I'M · สวัสดีครับ ผม</text>

    <!-- Big Bold Hero Name -->
    <text x="0" y="136" class="big" font-size="82" fill="#f0f6fc">ZEDRAYAMI<tspan fill="#58a6ff">.</tspan></text>

    <!-- Handle with Blinking Block Cursor -->
    <text x="0" y="174" class="mono" font-size="18" font-weight="700" fill="#58a6ff">&gt; Zed<tspan fill="#58a6ff">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete" /></tspan></text>

    <!-- Thai Tagline in Clean Loopless Thai Font -->
    <text x="0" y="210" class="thm" font-size="16" font-weight="500" fill="#f0f6fc">สำรวจจุดที่ซอฟต์แวร์เชื่อมต่อกับโลกความจริง</text>

    <!-- Focus Domains -->
    <text x="0" y="244" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" letter-spacing="1.5">COMPETITIVE PROGRAMMING · AIoT · SCIENTIFIC COMPUTING · WEB DEV</text>
  </g>

  <!-- RIGHT: MINIMALIST GEOMETRIC ACOUSTIC BARS & FLOATING CUBES -->
  <g transform="translate(760, 0)">
    <!-- Standing Wave Reference Curve -->
    <path d="M 0 160 Q 80 80, 160 160 T 320 160" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3 4" />
    <path d="M 20 160 Q 95 100, 170 160 T 320 160" fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.8" />

    <!-- Minimalist 3D-Style Amplitude Equalizer Bars -->
    <rect x="80" y="140" width="30" height="70" rx="3" fill="#14161a" stroke="#21262d" stroke-width="1" />
    <rect x="120" y="115" width="30" height="95" rx="3" fill="#181a20" stroke="#30363d" stroke-width="1" />
    <rect x="160" y="90" width="30" height="120" rx="3" fill="#1c2028" stroke="#30363d" stroke-width="1" />
    <rect x="200" y="65" width="30" height="145" rx="3" fill="#202632" stroke="#58a6ff" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Floating Geometric Cubes -->
    <rect x="25" y="138" width="32" height="32" rx="4" fill="#f0f6fc">
      <animate attributeName="y" values="138;132;138" dur="3s" repeatCount="indefinite" />
    </rect>

    <rect x="235" y="42" width="20" height="20" rx="3" fill="#58a6ff">
      <animate attributeName="y" values="42;35;42" dur="2.4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
