<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Metallic Titanium Light Shift -->
    <linearGradient id="metalShift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Refined Cyan/Blue Ambient Spot -->
    <filter id="softBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .sf-caps {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 800;
        text-anchor: middle;
      }
      .sf-sub2 {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 500;
        text-anchor: middle;
      }
      .ambient-pulse {
        animation: breathGlow2 8s ease-in-out infinite alternate;
      }
      @keyframes breathGlow2 {
        0% { opacity: 0.2; transform: scale(0.92); }
        100% { opacity: 0.45; transform: scale(1.08); }
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="918" height="238" rx="24" fill="url(#bgGrad2)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Ambient Blue Backlight -->
  <g filter="url(#softBlue)" class="ambient-pulse">
    <ellipse cx="460" cy="120" rx="260" ry="60" fill="#0284c7" />
  </g>

  <!-- Giant Hero Name: ZHERMOS -->
  <text x="460" y="132" class="sf-caps" font-size="74" fill="url(#metalShift)" letter-spacing="4">
    ZHERMOS
  </text>

  <!-- Subtitle: Zedrayami -->
  <text x="460" y="174" class="sf-sub2" font-size="13" fill="#64748b" letter-spacing="5">
    ZEDRAYAMI
  </text>
</svg>
