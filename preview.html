<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: ZEDRAYAMI Binary Typing + Enter Transition</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      padding: 60px 20px;
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p {
      color: #64748b;
      font-size: 14px;
    }
    .banner-container {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    .code {
      margin-top: 24px;
      display: inline-block;
      background: #090a0f;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 20px;
      font-family: "SF Mono", Monaco, monospace;
      color: #38bdf8;
      font-size: 13.5px;
      user-select: all;
    }
  </style>
</head>
<body>
  <header>
    <h1>ZEDRAYAMI · Binary Typing &amp; Enter Transition</h1>
    <p>พิมพ์เลขฐานสองทีละตัว ➔ กด Enter วาบ ➔ เปลี่ยนเป็นชื่อสายงาน ➔ เคอร์เซอร์ไม่ทับตัวอักษร 100%</p>
  </header>

  <div class="banner-container">
    <img src="banner.svg" alt="ZEDRAYAMI">
  </div>

  <div class="code">
    &lt;p align="center"&gt;&lt;img src="banner.svg" width="100%" alt="ZEDRAYAMI" /&gt;&lt;/p&gt;
  </div>
</body>
</html>
