<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: ZEDRAYAMI GitHub Banner (Harmonic Minimal)</title>
  <style>
    body {
      background-color: #020306;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      padding: 50px 20px;
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    p {
      color: #64748b;
      font-size: 14px;
    }
    .banner-card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      background: #07090e;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .banner-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .code-box {
      margin-top: 24px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px 18px;
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 13.5px;
      color: #38bdf8;
      user-select: all;
    }
  </style>
</head>
<body>
  <header>
    <h1>Original Harmonic Minimal Banner: ZEDRAYAMI</h1>
    <p>ดีไซน์ใหม่สไตล์ Cupertino Precision • ไม่ก๊อปปี้ • คลื่น Harmonic Waveform เคลื่อนไหว • ฟอนต์ Apple SF Pro</p>
  </header>

  <div class="banner-card">
    <img src="banner.svg" alt="Zedrayami Banner">
  </div>

  <div class="code-box">
    &lt;p align="center"&gt;&lt;img src="banner.svg" width="100%" alt="ZEDRAYAMI" /&gt;&lt;/p&gt;
  </div>
</body>
</html>
