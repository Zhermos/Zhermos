<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Deep Space Black Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Metallic Titanium Shine on Name -->
    <linearGradient id="nameShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Ambient Glow behind Text -->
    <radialGradient id="midLeftGlow" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <style>
      .sf-heavy {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 800;
      }
      .sf-sub {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 500;
      }
      .sf-mono {
        font-family: "SF Mono", Monaco, "Cascadia Code", "Courier New", monospace;
      }

      /* Blinking Cursor Animation */
      .blinking-cursor {
        animation: cursorBlink 0.9s step-end infinite;
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* 4-Phase Binary Transition Loop (Total 12s, 3s per topic) */

      /* Topic 1: AIoT Systems (0% - 25%) */
      .topic-1-bin {
        animation: animT1Bin 12s infinite;
      }
      .topic-1-txt {
        animation: animT1Txt 12s infinite;
      }
      @keyframes animT1Bin {
        0% { opacity: 1; transform: translateY(0); }
        1.5% { opacity: 0.7; }
        3% { opacity: 0.9; }
        4% { opacity: 0; transform: translateY(-2px); }
        25%, 100% { opacity: 0; }
      }
      @keyframes animT1Txt {
        0%, 3.5% { opacity: 0; transform: translateY(3px); }
        4.5% { opacity: 1; transform: translateY(0); }
        21% { opacity: 1; transform: translateY(0); }
        23.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }

      /* Topic 2: iOS & Swift Architecture (25% - 50%) */
      .topic-2-bin {
        animation: animT2Bin 12s infinite;
      }
      .topic-2-txt {
        animation: animT2Txt 12s infinite;
      }
      @keyframes animT2Bin {
        0%, 24% { opacity: 0; }
        25% { opacity: 1; transform: translateY(0); }
        26.5% { opacity: 0.6; }
        28% { opacity: 0.9; }
        29% { opacity: 0; transform: translateY(-2px); }
        50%, 100% { opacity: 0; }
      }
      @keyframes animT2Txt {
        0%, 28.5% { opacity: 0; transform: translateY(3px); }
        29.5% { opacity: 1; transform: translateY(0); }
        46% { opacity: 1; transform: translateY(0); }
        48.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }

      /* Topic 3: Computer Vision & AI (50% - 75%) */
      .topic-3-bin {
        animation: animT3Bin 12s infinite;
      }
      .topic-3-txt {
        animation: animT3Txt 12s infinite;
      }
      @keyframes animT3Bin {
        0%, 49% { opacity: 0; }
        50% { opacity: 1; transform: translateY(0); }
        51.5% { opacity: 0.7; }
        53% { opacity: 0.9; }
        54% { opacity: 0; transform: translateY(-2px); }
        75%, 100% { opacity: 0; }
      }
      @keyframes animT3Txt {
        0%, 53.5% { opacity: 0; transform: translateY(3px); }
        54.5% { opacity: 1; transform: translateY(0); }
        71% { opacity: 1; transform: translateY(0); }
        73.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }

      /* Topic 4: Biomedical Computing (75% - 100%) */
      .topic-4-bin {
        animation: animT4Bin 12s infinite;
      }
      .topic-4-txt {
        animation: animT4Txt 12s infinite;
      }
      @keyframes animT4Bin {
        0%, 74% { opacity: 0; }
        75% { opacity: 1; transform: translateY(0); }
        76.5% { opacity: 0.6; }
        78% { opacity: 0.9; }
        79% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }
      @keyframes animT4Txt {
        0%, 78.5% { opacity: 0; transform: translateY(3px); }
        79.5% { opacity: 1; transform: translateY(0); }
        96% { opacity: 1; transform: translateY(0); }
        98.5%, 100% { opacity: 0; transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="918" height="218" rx="20" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Ambient Light on the Mid-Left -->
  <rect x="1" y="1" width="918" height="218" rx="20" fill="url(#midLeftGlow)" />

  <!-- ================= MID-LEFT HERO GROUP ================= -->
  <g transform="translate(68, 0)">
    
    <!-- 1. Giant Name in Mid-Left Position -->
    <text x="0" y="108" class="sf-heavy" font-size="70" fill="url(#nameShine)" letter-spacing="-1.2">
      ZEDRAYAMI
    </text>

    <!-- 2. Dynamic Binary-to-Text Transition Subtitle Line -->
    <g transform="translate(2, 154)">
      <!-- Prefix Prompt Symbol -->
      <text x="0" y="0" class="sf-mono" font-size="16" font-weight="700" fill="#38bdf8">&gt;</text>

      <!-- Topic 1: AIoT Systems -->
      <g transform="translate(20, 0)">
        <text class="sf-mono topic-1-bin" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1">
          01000001 01001001 01101111 01010100
        </text>
        <text class="sf-sub topic-1-txt" font-size="17" fill="#e2e8f0" letter-spacing="0.3">
          AIoT &amp; Embedded Systems
        </text>
      </g>

      <!-- Topic 2: iOS & Swift Architecture -->
      <g transform="translate(20, 0)">
        <text class="sf-mono topic-2-bin" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1">
          01101001 01001111 01010011 00100000
        </text>
        <text class="sf-sub topic-2-txt" font-size="17" fill="#e2e8f0" letter-spacing="0.3">
          iOS &amp; Swift Architecture
        </text>
      </g>

      <!-- Topic 3: Computer Vision & AI -->
      <g transform="translate(20, 0)">
        <text class="sf-mono topic-3-bin" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1">
          01010110 01001001 01010011 00101100
        </text>
        <text class="sf-sub topic-3-txt" font-size="17" fill="#e2e8f0" letter-spacing="0.3">
          Computer Vision &amp; Deep Learning
        </text>
      </g>

      <!-- Topic 4: Biomedical Computing -->
      <g transform="translate(20, 0)">
        <text class="sf-mono topic-4-bin" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1">
          01000010 01001001 01001111 01101101
        </text>
        <text class="sf-sub topic-4-txt" font-size="17" fill="#e2e8f0" letter-spacing="0.3">
          Biomedical Nanotech Computing
        </text>
      </g>

      <!-- Blinking Cyan Cursor Indicator -->
      <rect class="blinking-cursor" x="330" y="-14" width="8" height="17" rx="1" fill="#38bdf8" />
    </g>

  </g>
</svg>
