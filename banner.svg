<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Deep Obsidian Void Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Apple Intelligence Liquid Shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ultra Soft Ambient Aura -->
    <filter id="softAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <style>
      .sf-heavy {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 800;
        text-anchor: middle;
      }
      .sf-sub {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 500;
        text-anchor: middle;
      }

      /* Slow Breathing Ambient Aura */
      .ambient-glow {
        animation: glowBreathe 8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes glowBreathe {
        0% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 0.55; transform: scale(1.1); }
        100% { opacity: 0.3; transform: scale(0.95); }
      }

      /* Subtle Hover/Float for Giant Name */
      .hero-title {
        animation: heroFloat 6s ease-in-out infinite alternate;
      }
      @keyframes heroFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Border Card -->
  <rect x="1" y="1" width="918" height="238" rx="24" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Soft Ambient Glow Behind Name -->
  <g filter="url(#softAura)" class="ambient-glow">
    <ellipse cx="400" cy="120" rx="220" ry="60" fill="#2563eb" />
    <ellipse cx="530" cy="120" rx="200" ry="60" fill="#7c3aed" />
  </g>

  <!-- Giant Hero Name Centerpiece -->
  <g class="hero-title">
    <text x="460" y="132" class="sf-heavy" font-size="78" fill="url(#shimmer)" letter-spacing="-2">
      Zedrayami
    </text>
  </g>

  <!-- Minimal Handle Tag (Subtle & Crisp) -->
  <text x="460" y="174" class="sf-sub" font-size="13" fill="#64748b" letter-spacing="4">
    @ZHERMOS
  </text>
</svg>
