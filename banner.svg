<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Deep Space Black Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Liquid Metallic Shimmer Animation -->
    <linearGradient id="nameShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="5.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Subtle Ambient Core Glow Behind Name -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <style>
      .sf-heavy {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: central;
      }

      /* Slow Breathing Ambient Aura */
      .ambient-glow {
        animation: glowPulse 7s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes glowPulse {
        0% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 0.45; transform: scale(1.1); }
        100% { opacity: 0.2; transform: scale(0.95); }
      }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="900" height="220" rx="20" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Soft Ambient Glow (Behind Name Only) -->
  <g filter="url(#softGlow)" class="ambient-glow">
    <ellipse cx="450" cy="110" rx="240" ry="50" fill="#2563eb" />
  </g>

  <!-- ONLY THE NAME: Massive, Centered, Animated -->
  <text x="50%" y="50%" class="sf-heavy" font-size="88" fill="url(#nameShimmer)" letter-spacing="1">
    ZEDRAYAMI
  </text>
</svg>
