<svg fill="none" viewBox="0 0 920 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style><![CDATA[
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .card {
          position: relative;
          width: 100%;
          height: 220px;
          background: linear-gradient(135deg, #090a0f 0%, #020305 100%);
          border-radius: 20px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-left: 68px;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
          user-select: none;
        }

        /* Ambient Glow Behind Text */
        .ambient-glow {
          position: absolute;
          left: 40px;
          top: 30px;
          width: 380px;
          height: 160px;
          background: radial-gradient(circle, rgba(30, 58, 138, 0.35) 0%, rgba(9, 10, 15, 0) 70%);
          pointer-events: none;
        }

        /* Giant Name in Mid-Left */
        .hero-name {
          font-size: 70px;
          font-weight: 800;
          letter-spacing: -1.5px;
          background: linear-gradient(180deg, #ffffff 20%, #cbd5e1 70%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          line-height: 1.1;
          margin-bottom: 14px;
        }

        /* Terminal Prompt Line */
        .terminal-box {
          position: relative;
          height: 32px;
          display: flex;
          align-items: center;
        }

        .topic-group {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          display: flex;
          align-items: center;
        }

        .prompt {
          font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
          color: #38bdf8;
          font-size: 18px;
          font-weight: 700;
          margin-right: 12px;
          line-height: 1;
        }

        .bin-line, .human-line {
          position: absolute;
          left: 0;
          top: 0;
          display: flex;
          align-items: center;
          white-space: nowrap;
        }

        /* Typing Binary Text */
        .type-bin {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
          font-size: 15px;
          font-weight: 600;
          color: #38bdf8;
          letter-spacing: 1px;
          border-right: 8px solid #38bdf8;
        }

        /* Decoded Human Text */
        .type-human {
          display: inline-block;
          white-space: nowrap;
          font-size: 17.5px;
          font-weight: 500;
          color: #f1f5f9;
          letter-spacing: 0.2px;
          border-right: 8px solid #38bdf8;
          padding-right: 2px;
        }

        /* Blinking Cursor Border */
        @keyframes cursorBlink {
          0%, 100% { border-color: #38bdf8; }
          50% { border-color: transparent; }
        }

        /* ================= 4-TOPIC TYPING & ENTER TIMELINE (24s Total, 6s Each) ================= */

        /* TOPIC 1: AIoT Systems (0% - 25%) */
        .t1-bin {
          animation: animT1Bin 24s infinite;
        }
        .t1-bin .type-bin {
          animation: animT1Type 24s steps(22, end) infinite, cursorBlink 0.75s step-end infinite;
        }
        .t1-human {
          animation: animT1Human 24s infinite;
        }
        .t1-human .type-human {
          animation: cursorBlink 0.75s step-end infinite;
        }

        @keyframes animT1Bin {
          0% { opacity: 1; visibility: visible; filter: brightness(1); }
          6.5% { filter: brightness(1); }
          7.5% { filter: brightness(2.5) drop-shadow(0 0 8px #ffffff); } /* Enter Pressed */
          8.2% { opacity: 0; visibility: hidden; }
          100% { opacity: 0; visibility: hidden; }
        }
        @keyframes animT1Type {
          0% { width: 0; }
          6.5% { width: 245px; }
          8.2%, 100% { width: 245px; }
        }
        @keyframes animT1Human {
          0%, 8.1% { opacity: 0; visibility: hidden; transform: translateY(3px); }
          8.5% { opacity: 1; visibility: visible; transform: translateY(0); }
          22% { opacity: 1; visibility: visible; transform: translateY(0); }
          24% { opacity: 0; visibility: hidden; transform: translateY(-3px); }
          100% { opacity: 0; visibility: hidden; }
        }

        /* TOPIC 2: iOS & Swift Architecture (25% - 50%) */
        .t2-bin {
          animation: animT2Bin 24s infinite;
        }
        .t2-bin .type-bin {
          animation: animT2Type 24s steps(22, end) infinite, cursorBlink 0.75s step-end infinite;
        }
        .t2-human {
          animation: animT2Human 24s infinite;
        }
        .t2-human .type-human {
          animation: cursorBlink 0.75s step-end infinite;
        }

        @keyframes animT2Bin {
          0%, 24.9% { opacity: 0; visibility: hidden; filter: brightness(1); }
          25% { opacity: 1; visibility: visible; filter: brightness(1); }
          31.5% { filter: brightness(1); }
          32.5% { filter: brightness(2.5) drop-shadow(0 0 8px #ffffff); } /* Enter Pressed */
          33.2% { opacity: 0; visibility: hidden; }
          100% { opacity: 0; visibility: hidden; }
        }
        @keyframes animT2Type {
          0%, 25% { width: 0; }
          31.5% { width: 245px; }
          33.2%, 100% { width: 245px; }
        }
        @keyframes animT2Human {
          0%, 33.1% { opacity: 0; visibility: hidden; transform: translateY(3px); }
          33.5% { opacity: 1; visibility: visible; transform: translateY(0); }
          47% { opacity: 1; visibility: visible; transform: translateY(0); }
          49% { opacity: 0; visibility: hidden; transform: translateY(-3px); }
          100% { opacity: 0; visibility: hidden; }
        }

        /* TOPIC 3: Computer Vision & AI (50% - 75%) */
        .t3-bin {
          animation: animT3Bin 24s infinite;
        }
        .t3-bin .type-bin {
          animation: animT3Type 24s steps(22, end) infinite, cursorBlink 0.75s step-end infinite;
        }
        .t3-human {
          animation: animT3Human 24s infinite;
        }
        .t3-human .type-human {
          animation: cursorBlink 0.75s step-end infinite;
        }

        @keyframes animT3Bin {
          0%, 49.9% { opacity: 0; visibility: hidden; filter: brightness(1); }
          50% { opacity: 1; visibility: visible; filter: brightness(1); }
          56.5% { filter: brightness(1); }
          57.5% { filter: brightness(2.5) drop-shadow(0 0 8px #ffffff); } /* Enter Pressed */
          58.2% { opacity: 0; visibility: hidden; }
          100% { opacity: 0; visibility: hidden; }
        }
        @keyframes animT3Type {
          0%, 50% { width: 0; }
          56.5% { width: 245px; }
          58.2%, 100% { width: 245px; }
        }
        @keyframes animT3Human {
          0%, 58.1% { opacity: 0; visibility: hidden; transform: translateY(3px); }
          58.5% { opacity: 1; visibility: visible; transform: translateY(0); }
          72% { opacity: 1; visibility: visible; transform: translateY(0); }
          74% { opacity: 0; visibility: hidden; transform: translateY(-3px); }
          100% { opacity: 0; visibility: hidden; }
        }

        /* TOPIC 4: Biomedical Computing (75% - 100%) */
        .t4-bin {
          animation: animT4Bin 24s infinite;
        }
        .t4-bin .type-bin {
          animation: animT4Type 24s steps(22, end) infinite, cursorBlink 0.75s step-end infinite;
        }
        .t4-human {
          animation: animT4Human 24s infinite;
        }
        .t4-human .type-human {
          animation: cursorBlink 0.75s step-end infinite;
        }

        @keyframes animT4Bin {
          0%, 74.9% { opacity: 0; visibility: hidden; filter: brightness(1); }
          75% { opacity: 1; visibility: visible; filter: brightness(1); }
          81.5% { filter: brightness(1); }
          82.5% { filter: brightness(2.5) drop-shadow(0 0 8px #ffffff); } /* Enter Pressed */
          83.2% { opacity: 0; visibility: hidden; }
          100% { opacity: 0; visibility: hidden; }
        }
        @keyframes animT4Type {
          0%, 75% { width: 0; }
          81.5% { width: 245px; }
          83.2%, 100% { width: 245px; }
        }
        @keyframes animT4Human {
          0%, 83.1% { opacity: 0; visibility: hidden; transform: translateY(3px); }
          83.5% { opacity: 1; visibility: visible; transform: translateY(0); }
          97% { opacity: 1; visibility: visible; transform: translateY(0); }
          99% { opacity: 0; visibility: hidden; transform: translateY(-3px); }
          100% { opacity: 0; visibility: hidden; }
        }
      ]]></style>

      <div class="card">
        <div class="ambient-glow"></div>

        <!-- Giant Name in Mid-Left -->
        <h1 class="hero-name">ZEDRAYAMI</h1>

        <!-- Typewriter & Enter Terminal Line -->
        <div class="terminal-box">

          <!-- TOPIC 1: AIoT Systems -->
          <div class="topic-group">
            <div class="bin-line t1-bin">
              <span class="prompt">&gt;</span>
              <span class="type-bin">01000001 01001001 01101111 01010100</span>
            </div>
            <div class="human-line t1-human">
              <span class="prompt">&gt;</span>
              <span class="type-human">AIoT &amp; Embedded Systems</span>
            </div>
          </div>

          <!-- TOPIC 2: iOS & Swift Architecture -->
          <div class="topic-group">
            <div class="bin-line t2-bin">
              <span class="prompt">&gt;</span>
              <span class="type-bin">01101001 01001111 01010011 00100000</span>
            </div>
            <div class="human-line t2-human">
              <span class="prompt">&gt;</span>
              <span class="type-human">iOS &amp; Swift Architecture</span>
            </div>
          </div>

          <!-- TOPIC 3: Computer Vision & AI -->
          <div class="topic-group">
            <div class="bin-line t3-bin">
              <span class="prompt">&gt;</span>
              <span class="type-bin">01010110 01001001 01010011 00101100</span>
            </div>
            <div class="human-line t3-human">
              <span class="prompt">&gt;</span>
              <span class="human-text type-human">Computer Vision &amp; Deep Learning</span>
            </div>
          </div>

          <!-- TOPIC 4: Biomedical Computing -->
          <div class="topic-group">
            <div class="bin-line t4-bin">
              <span class="prompt">&gt;</span>
              <span class="type-bin">01000010 01001001 01001111 01101101</span>
            </div>
            <div class="human-line t4-human">
              <span class="prompt">&gt;</span>
              <span class="type-human">Biomedical Nanotech Computing</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>
