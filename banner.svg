<svg fill="none" viewBox="0 0 920 340" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .card {
          position: relative;
          width: 100%;
          height: 340px;
          background: #090c15;
          border-radius: 20px;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
          color: #f1f5f9;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 38px 46px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56);
          user-select: none;
        }

        /* Ambient Dynamic Glows */
        .ambient-glow {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
          opacity: 0.45;
          animation: floatGlow 10s ease-in-out infinite alternate;
        }
        .glow-1 {
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, #2563eb 0%, rgba(37, 99, 235, 0) 70%);
          top: -100px;
          right: -40px;
          animation-delay: 0s;
        }
        .glow-2 {
          width: 280px;
          height: 280px;
          background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
          bottom: -100px;
          left: 10%;
          animation-delay: -5s;
        }

        @keyframes floatGlow {
          0% {
            transform: translate(0, 0) scale(1);
            opacity: 0.35;
          }
          50% {
            transform: translate(-20px, 15px) scale(1.12);
            opacity: 0.55;
          }
          100% {
            transform: translate(25px, -20px) scale(0.95);
            opacity: 0.4;
          }
        }

        /* Subtle Geometric Background Rings */
        .orbit-container {
          position: absolute;
          right: 35px;
          top: 50%;
          transform: translateY(-50%);
          width: 240px;
          height: 240px;
          pointer-events: none;
          opacity: 0.18;
        }
        .orbit-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 1px dashed #94a3b8;
          animation: rotateOrbit 50s linear infinite;
        }
        .orbit-ring-inner {
          position: absolute;
          inset: 35px;
          border-radius: 50%;
          border: 1px solid rgba(148, 163, 184, 0.4);
          animation: rotateOrbit 30s linear infinite reverse;
        }
        .orbit-core {
          position: absolute;
          inset: 75px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, transparent 70%);
          border: 1px solid rgba(96, 165, 250, 0.3);
        }

        @keyframes rotateOrbit {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        /* Top Row Meta Bar */
        .top-row {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 9px;
          padding: 6px 14px;
          background: rgba(16, 185, 129, 0.08);
          border: 1px solid rgba(16, 185, 129, 0.24);
          border-radius: 9999px;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }
        .status-dot-wrap {
          position: relative;
          width: 8px;
          height: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .status-dot {
          width: 8px;
          height: 8px;
          background-color: #10b981;
          border-radius: 50%;
        }
        .status-pulse {
          position: absolute;
          width: 8px;
          height: 8px;
          background-color: #10b981;
          border-radius: 50%;
          animation: pulseRing 2.2s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        }

        @keyframes pulseRing {
          0% {
            transform: scale(1);
            opacity: 0.9;
          }
          100% {
            transform: scale(3.2);
            opacity: 0;
          }
        }

        .status-text {
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: 0.8px;
          color: #34d399;
          text-transform: uppercase;
        }
        .github-handle {
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 0.5px;
          color: #64748b;
          font-feature-settings: "cv02", "cv03", "cv04", "cv11";
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .github-handle span {
          color: #94a3b8;
          font-weight: 600;
        }

        /* Center Hero Typography */
        .hero-section {
          position: relative;
          z-index: 2;
          margin-top: 4px;
        }
        .name-row {
          display: flex;
          align-items: baseline;
          gap: 14px;
        }
        .hero-name {
          font-size: 46px;
          font-weight: 700;
          letter-spacing: -1.2px;
          line-height: 1.1;
          background: linear-gradient(180deg, #ffffff 15%, #cbd5e1 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .role-tagline {
          margin-top: 10px;
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 17px;
          font-weight: 400;
          color: #94a3b8;
          letter-spacing: -0.2px;
          height: 26px;
        }
        .typing-effect {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 2px solid #38bdf8;
          animation: typingText 10s steps(44, end) infinite, blinkCursor 0.85s step-end infinite;
          color: #e2e8f0;
          font-weight: 500;
        }

        @keyframes typingText {
          0%, 5% {
            width: 0;
          }
          35%, 65% {
            width: 100%;
          }
          95%, 100% {
            width: 0;
          }
        }

        @keyframes blinkCursor {
          0%, 100% { border-color: #38bdf8; }
          50% { border-color: transparent; }
        }

        /* Bottom Tech Stack Capsules */
        .bottom-row {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 14px;
          border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .skills-list {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .skill-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 13px;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.035);
          border: 1px solid rgba(255, 255, 255, 0.08);
          font-size: 12.5px;
          font-weight: 500;
          color: #cbd5e1;
          letter-spacing: -0.1px;
          transition: border-color 0.3s;
        }
        .pill-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
        }
        .dot-swift { background-color: #f05138; box-shadow: 0 0 6px rgba(240, 81, 56, 0.6); }
        .dot-ai { background-color: #38bdf8; box-shadow: 0 0 6px rgba(56, 189, 248, 0.6); }
        .dot-bio { background-color: #a855f7; box-shadow: 0 0 6px rgba(168, 85, 247, 0.6); }
        .dot-sys { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); }

        .system-meta {
          font-size: 12px;
          font-weight: 500;
          color: #475569;
          letter-spacing: 0.4px;
          text-transform: uppercase;
        }
      </style>

      <div class="card">
        <!-- Ambient Radial Backlights -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <!-- Subtle Background Orbit Accent -->
        <div class="orbit-container">
          <div class="orbit-ring"></div>
          <div class="orbit-ring-inner"></div>
          <div class="orbit-core"></div>
        </div>

        <!-- Top Row: Status Indicator & Handle -->
        <div class="top-row">
          <div class="status-badge">
            <div class="status-dot-wrap">
              <div class="status-pulse"></div>
              <div class="status-dot"></div>
            </div>
            <span class="status-text">Available for Research &amp; Engineering</span>
          </div>

          <div class="github-handle">
            github.com/<span>Zhermos</span>
          </div>
        </div>

        <!-- Center Hero Typography -->
        <div class="hero-section">
          <div class="name-row">
            <h1 class="hero-name">Zedrayami</h1>
          </div>
          <div class="role-tagline">
            <span style="color: #64748b;">Specializing in</span>
            <div class="typing-effect">Swift / iOS Systems • AI &amp; Bio-Vision • Creative Computing</div>
          </div>
        </div>

        <!-- Bottom Row: Stack Pills & Formal Tag -->
        <div class="bottom-row">
          <div class="skills-list">
            <div class="skill-pill">
              <span class="pill-dot dot-swift"></span>
              <span>Swift / SwiftUI</span>
            </div>
            <div class="skill-pill">
              <span class="pill-dot dot-ai"></span>
              <span>AI &amp; Computer Vision</span>
            </div>
            <div class="skill-pill">
              <span class="pill-dot dot-bio"></span>
              <span>Biomedical Nanotech</span>
            </div>
            <div class="skill-pill">
              <span class="pill-dot dot-sys"></span>
              <span>Algorithms</span>
            </div>
          </div>

          <div class="system-meta">Cupertino Minimal Standard</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
