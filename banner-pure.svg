<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Subtle Radial Lights -->
    <radialGradient id="ambientLight1" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientLight2" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Accent Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)" />
      <stop offset="50%" stop-color="rgba(56,189,248,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>

    <!-- Shimmer Line Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <style>
      .sf-font {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      }
      
      /* Subtle Breathing Ambient Lights */
      .ambient-glow-node {
        animation: breathGlow 8s ease-in-out infinite alternate;
      }
      @keyframes breathGlow {
        0% { opacity: 0.65; transform: scale(1); }
        100% { opacity: 0.95; transform: scale(1.08); }
      }

      /* Pulsing Status Dot */
      .pulse-circle {
        animation: pulseRing 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        transform-origin: 58px 50px;
      }
      @keyframes pulseRing {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 14px; opacity: 0; }
      }

      /* Rotating Minimal Gyroscope Rings */
      .orbit-group {
        transform-origin: 790px 160px;
        animation: rotateRing 60s linear infinite;
      }
      .orbit-group-rev {
        transform-origin: 790px 160px;
        animation: rotateRingRev 40s linear infinite;
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateRingRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* Subtle Light Sheen Beam */
      .shimmer-line {
        animation: slideSheen 8s ease-in-out infinite;
      }
      @keyframes slideSheen {
        0% { transform: translateX(-400px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(950px); opacity: 0; }
      }

      /* Soft Text Fade Loop */
      .tagline-text {
        animation: softFade 8s ease-in-out infinite;
      }
      @keyframes softFade {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="918" height="318" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Ambient Light Fields -->
  <g class="ambient-glow-node">
    <rect x="1" y="1" width="918" height="318" rx="20" fill="url(#ambientLight1)" />
    <rect x="1" y="1" width="918" height="318" rx="20" fill="url(#ambientLight2)" />
  </g>

  <!-- Background Technical Grid Dots -->
  <g fill="#334155" opacity="0.18">
    <circle cx="700" cy="50" r="1.5" />
    <circle cx="730" cy="50" r="1.5" />
    <circle cx="760" cy="50" r="1.5" />
    <circle cx="790" cy="50" r="1.5" />
    <circle cx="820" cy="50" r="1.5" />
    <circle cx="850" cy="50" r="1.5" />
    <circle cx="700" cy="80" r="1.5" />
    <circle cx="730" cy="80" r="1.5" />
    <circle cx="760" cy="80" r="1.5" />
    <circle cx="790" cy="80" r="1.5" />
    <circle cx="820" cy="80" r="1.5" />
    <circle cx="850" cy="80" r="1.5" />
  </g>

  <!-- Minimalist Geometric Orbit Accent (Right Side) -->
  <g opacity="0.22">
    <g class="orbit-group">
      <circle cx="790" cy="160" r="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8 8" />
      <circle cx="790" cy="70" r="3.5" fill="#38bdf8" />
    </g>
    <g class="orbit-group-rev">
      <circle cx="790" cy="160" r="62" stroke="#64748b" stroke-width="1.2" />
      <circle cx="852" cy="160" r="3" fill="#818cf8" />
    </g>
    <circle cx="790" cy="160" r="36" stroke="rgba(56,189,248,0.4)" stroke-width="1" fill="rgba(56,189,248,0.06)" />
    <circle cx="790" cy="160" r="4" fill="#38bdf8" />
  </g>

  <!-- Top Bar: Status Badge -->
  <g>
    <!-- Badge Pill Container -->
    <rect x="44" y="34" width="276" height="32" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1" />
    <!-- Pulse Ripple Ring -->
    <circle class="pulse-circle" cx="58" cy="50" r="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.8" />
    <!-- Center Dot -->
    <circle cx="58" cy="50" r="4" fill="#10b981" />
    <!-- Badge Label -->
    <text x="73" y="54" class="sf-font" font-size="11" font-weight="600" fill="#34d399" letter-spacing="0.8">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Top Bar: GitHub Handle -->
  <text x="876" y="55" text-anchor="end" class="sf-font" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
    github.com/<tspan fill="#cbd5e1" font-weight="600">Zhermos</tspan>
  </text>

  <!-- Center Hero: Title / Name -->
  <text x="44" y="142" class="sf-font" font-size="46" font-weight="700" fill="url(#textGrad)" letter-spacing="-1.2">Zedrayami</text>

  <!-- Center Hero: Tagline / Subtitle -->
  <g class="tagline-text">
    <text x="44" y="178" class="sf-font" font-size="16" font-weight="400" fill="#64748b" letter-spacing="-0.2">
      Specializing in <tspan fill="#e2e8f0" font-weight="500">iOS &amp; Swift Architecture</tspan> • <tspan fill="#e2e8f0" font-weight="500">AI &amp; Bio-Computing</tspan> • <tspan fill="#e2e8f0" font-weight="500">Creative Systems</tspan>
    </text>
  </g>

  <!-- Sleek Divider with Shimmer Accent -->
  <line x1="44" y1="216" x2="876" y2="216" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
  <g class="shimmer-line">
    <line x1="0" y1="216" x2="220" y2="216" stroke="url(#shimmerGrad)" stroke-width="1.8" />
  </g>

  <!-- Bottom Row: Cupertino Skill Capsules -->
  <!-- Capsule 1: Swift -->
  <g transform="translate(44, 238)">
    <rect width="132" height="34" rx="8" fill="rgba(255, 255, 255, 0.035)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#f05138" />
    <text x="28" y="22" class="sf-font" font-size="12" font-weight="500" fill="#e2e8f0" letter-spacing="-0.1">Swift &amp; SwiftUI</text>
  </g>

  <!-- Capsule 2: AI & CV -->
  <g transform="translate(186, 238)">
    <rect width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.035)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#38bdf8" />
    <text x="28" y="22" class="sf-font" font-size="12" font-weight="500" fill="#e2e8f0" letter-spacing="-0.1">AI &amp; Computer Vision</text>
  </g>

  <!-- Capsule 3: Bio & Nanotech -->
  <g transform="translate(366, 238)">
    <rect width="186" height="34" rx="8" fill="rgba(255, 255, 255, 0.035)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#a855f7" />
    <text x="28" y="22" class="sf-font" font-size="12" font-weight="500" fill="#e2e8f0" letter-spacing="-0.1">Biomedical Nanotech</text>
  </g>

  <!-- Capsule 4: Systems -->
  <g transform="translate(562, 238)">
    <rect width="144" height="34" rx="8" fill="rgba(255, 255, 255, 0.035)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#10b981" />
    <text x="28" y="22" class="sf-font" font-size="12" font-weight="500" fill="#e2e8f0" letter-spacing="-0.1">Applied Algorithms</text>
  </g>

  <!-- Right Meta Spec -->
  <text x="876" y="260" text-anchor="end" class="sf-font" font-size="11.5" font-weight="500" fill="#475569" letter-spacing="0.5">
    CUPERTINO MINIMAL
  </text>
</svg>
